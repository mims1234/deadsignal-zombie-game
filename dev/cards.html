<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>card carrier line-up</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px/1.35 system-ui, "Segoe UI", sans-serif; color: #dfe6f2; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 10px 12px 12px; background: linear-gradient(transparent, rgba(4, 6, 12, 0.85) 45%); }
      button { font: inherit; color: #dfe6f2; background: rgba(22, 27, 40, 0.85); border: 1px solid #3a4560; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
      button:hover { border-color: #7f8fb8; }
      button.on { background: #dfe6f2; color: #0b0e16; border-color: #dfe6f2; }
      #hint { position: fixed; left: 12px; top: 10px; color: #9aa6bb; text-shadow: 0 1px 3px #000; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="hint">Drag to orbit, scroll to zoom</div>
    <div id="bar"><div id="modes" style="display: contents"></div></div>
    <script type="module" src="./cards.ts"></script>
  </body>
</html>
