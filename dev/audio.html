<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>audio harness</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #0b1016; color: #b9c7d4; font: 12px/1.35 ui-monospace, "SF Mono", Menlo, monospace; }
      body { padding: 14px 16px 40px; }
      h1 { font-size: 15px; margin: 0 0 8px; letter-spacing: 0.08em; color: #e8eef4; }
      h2 { font-size: 11px; margin: 16px 0 6px; letter-spacing: 0.14em; color: #7fa2c0; text-transform: uppercase; }
      .bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 8px 10px; background: #111a23; border: 1px solid #1f2d3a; }
      .bar label { display: flex; gap: 6px; align-items: center; }
      button { background: #182634; color: #cfe0ee; border: 1px solid #2b4257; padding: 3px 8px; font: inherit; cursor: pointer; }
      button:hover { background: #21364a; }
      button.on { background: #3b5a2a; border-color: #6a9a4a; }
      .grid { display: flex; flex-wrap: wrap; gap: 4px; }
      #log { white-space: pre; color: #8fb3a0; max-height: 220px; overflow: auto; background: #0e151c; padding: 8px; border: 1px solid #1a2733; }
      #sheet canvas { display: block; margin: 0 0 6px; }
      #sheet { display: grid; grid-template-columns: repeat(4, 312px); gap: 4px 6px; }
      .cell { background: #0e151c; border: 1px solid #1b2a37; padding: 2px; }
      .cell div { font-size: 10px; color: #98b0c4; padding: 1px 3px; white-space: nowrap; overflow: hidden; }
    </style>
  </head>
  <body>
    <h1>ZOMBIES GENXMIMS // AUDIO HARNESS</h1>
    <div id="app"></div>
    <div id="sheet"></div>
    <script type="module" src="./audio.ts"></script>
  </body>
</html>
